[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gallery-tool"
version = "2.0.0"
description = "本地图片浏览与去重工具"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
keywords = ["gallery", "image", "dedup", "phash", "local-first", "cosplay"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "Pillow>=12.2",
  "numpy>=2.4",
  "scipy>=1.17",
  "fastapi>=0.148",
  "uvicorn>=0.38",
  "watchfiles>=1.1",
  "pywin32>=311; sys_platform == 'win32'",
  "threadpoolctl>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.14", "httpx>=0.28", "psutil>=7.0"]
desktop = ["pyinstaller>=6.0"]

[project.scripts]
gallery = "gallery.__main__:main"

[tool.setuptools]
py-modules = [
  "gallery_cli", "gallery_server",
  "pkgpath", "dedup_build", "dedup_analyze", "dedup_verify",
  "dedup_husk", "dedup_health", "dedup_cover", "dedup_clean",
]

[tool.setuptools.packages.find]
include = ["gallery", "gallery.*"]

[tool.setuptools.package-data]
gallery = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# tests/ 下还混着几个"需要服务在跑 + 需要真实图库"的老式集成脚本
# （hardening_check / browser_probe / dedup_ui_probe / api_regression / delete_path_check），
# 它们不是 pytest 用例，别被收集进来。
norecursedirs = ["cache", "thumbs", "ui"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["node_modules", "build", "build-out", "dist*", "release*", "cache", "thumbs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
