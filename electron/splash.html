<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GalleryTool</title>
<style>
  /* 启动画面：Python 后端要 3-50 秒才就绪，这段时间不能给用户看白屏。
     配色与主界面一致（#16171b），切换时不会闪。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #16171b; color: #e8e9ec;
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    -webkit-app-region: drag;          /* 整块可拖动 */
    user-select: none;
  }
  .logo {
    width: 64px; height: 64px; border-radius: 14px;
    background: linear-gradient(135deg, #4a6cf7, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px rgba(74,108,247,.35);
    margin-bottom: 20px;
  }
  .logo svg { width: 34px; height: 34px; }
  .title { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  .sub { margin-top: 6px; font-size: 12px; color: #8b8f9a; }

  .dots { display: flex; gap: 5px; margin-top: 26px; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: #4a6cf7;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots i:nth-child(2) { animation-delay: .15s; background: #6b7cf7; }
  .dots i:nth-child(3) { animation-delay: .3s; background: #7c3aed; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .45; }
    40% { transform: translateY(-6px); opacity: 1; }
  }
  .hint {
    position: absolute; bottom: 18px; font-size: 11px; color: #5a5f6b;
  }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
  </div>
  <div class="title">GalleryTool</div>
  <div class="sub" id="msg">正在启动图库服务…</div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="hint">首次启动需要校验 125 个文件夹，请稍候</div>
  <script>
    // 只是给用户一点"在动"的感觉，真实进度由主进程控制（就绪后直接关掉本窗口）
    const steps = ['正在启动图库服务…', '正在校验文件夹…', '正在准备缩略图…'];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % steps.length;
      document.getElementById('msg').textContent = steps[i];
    }, 2600);
  </script>
</body>
</html>
