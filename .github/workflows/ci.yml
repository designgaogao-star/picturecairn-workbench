name: Windows checks

on:
  pull_request:
  push:
    branches: [main, master, feat/backend-v2]
  workflow_dispatch:
    inputs:
      integration_runs:
        description: 'Total isolated business runs for diagnosing intermittent HTTP failures'
        type: choice
        options: ['1', '5', '10']
        default: '1'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.21'
          python-version: '3.14'
          enable-cache: true
      - name: Install locked dependencies
        shell: pwsh
        run: |
          uv sync --frozen --extra dev --extra desktop --link-mode copy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated source checks
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1
      - name: Reproduce intermittent library HTTP failures
        if: github.event_name == 'workflow_dispatch' && inputs.integration_runs != '1'
        shell: pwsh
        env:
          INTEGRATION_RUNS: ${{ inputs.integration_runs }}
        run: |
          for ($attempt = 1; $attempt -lt [int]$env:INTEGRATION_RUNS; $attempt++) {
            & node scripts/ui-qa/run.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check generated contract is current
        shell: pwsh
        run: git diff --exit-code -- contracts/openapi.json contracts/schema.d.ts
      - name: Keep synthetic QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-ui-evidence
          path: output/ui-qa/
          if-no-files-found: ignore
          retention-days: 7
