<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽样快审</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#1b1c20;--panel:#23252b;--panel2:#2a2d34;--panel3:#31343d;
    --line:#383b44;--line2:#42454f;--txt:#e7e8ec;--dim:#9699a3;--faint:#6b6e78;
    --accent:#5b8cff;--danger:#ff5d5d;--ok:#35c877;--warn:#ffb020;
  }
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  #app{display:flex;flex-direction:column;height:100vh}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#3a3d46;border-radius:6px;border:2px solid var(--bg)}

  /* 顶栏 */
  #top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  #top h1{font-size:15px;display:flex;align-items:center;gap:8px}
  #top h1::before{content:"";width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--accent),#9b6bff)}
  #stat{color:var(--dim);font-size:12px;display:flex;gap:14px}
  #stat b{color:var(--txt)}
  #stat .mk{color:var(--danger);font-weight:700}#stat .kp{color:var(--ok);font-weight:700}
  #top .sp{flex:1}
  .tbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
  .tbtn:hover{border-color:var(--accent)}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 6px;font-size:12px;outline:none}

  #body{flex:1;display:flex;min-height:0}
  /* 左：组列表 */
  #side{width:300px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #sideHead{padding:9px 13px;font-size:11.5px;color:var(--faint);border-bottom:1px solid var(--line)}
  #gList{flex:1;overflow-y:auto}
  .g{padding:8px 13px;border-bottom:1px solid #26282e;cursor:pointer;display:flex;gap:9px;align-items:center;border-left:3px solid transparent}
  .g:hover{background:var(--panel2)}
  .g.active{background:#314063;border-left-color:var(--accent)}
  .g.kept{border-left-color:var(--ok)}.g.marked{border-left-color:var(--danger)}
  .g .ico{width:14px;text-align:center;flex-shrink:0;color:var(--faint)}
  .g.kept .ico{color:var(--ok)}.g.marked .ico{color:var(--danger)}
  .g .m{flex:1;min-width:0}
  .g .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g .sb{font-size:10.5px;color:var(--faint);margin-top:2px}
  .tag{font-size:9px;padding:0 5px;border-radius:4px;font-weight:700}
  .tag-R18{background:#5e2a2a;color:#ff9a9a}.tag-R16{background:#2a3f5e;color:#9ac0ff}
  .tag-非R18{background:#27503a;color:#8fe0b0}.tag-其他{background:#444;color:#ccc}

  /* 右：抽样主区 */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #gBar{padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px}
  #gName{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  #gMeta{color:var(--dim);font-size:12px;white-space:nowrap}
  #gBar .sp{flex:1}
  #gridWrap{flex:1;overflow-y:auto;padding:16px 18px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .cell{position:relative;border-radius:9px;overflow:hidden;background:#15171c;border:1px solid #26282e;aspect-ratio:3/4;cursor:zoom-in;animation:cellpulse 1.4s ease-in-out infinite}
  @keyframes cellpulse{0%,100%{background:#15171c}50%{background:#1b1d23}}
  .cell.loaded{animation:none}
  .cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s ease}
  .cell img.in{opacity:1}
  .cell .vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--accent);background:linear-gradient(135deg,#20222a,#141519)}
  .cell .idx{position:absolute;left:7px;top:7px;background:rgba(0,0,0,.66);color:#fff;font-size:10px;padding:2px 7px;border-radius:20px}
  .cell .alb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#ddd;font-size:10px;padding:14px 7px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);line-height:2.2;text-align:center}

  /* 底部判定条 */
  #decide{padding:11px 18px;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px;justify-content:center}
  .dbtn{border-radius:9px;padding:11px 22px;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-weight:600}
  .dbtn:hover{filter:brightness(1.15)}
  .dbtn.ok{border-color:var(--ok);color:var(--ok)}
  .dbtn.del{border-color:var(--danger);color:var(--danger)}
  .dbtn.ghost{color:var(--dim);font-weight:400}
  #pos{min-width:90px;text-align:center;color:var(--dim);font-variant-numeric:tabular-nums}
  #hint{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);color:var(--faint);font-size:11px}

  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:none;align-items:center;justify-content:center}
  #lb.on{display:flex}
  #lb img{max-width:96vw;max-height:94vh;object-fit:contain;box-shadow:0 8px 40px #000}
  #lb .cap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#bbb;font-size:12px;background:rgba(0,0,0,.5);padding:5px 14px;border-radius:20px;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
  #lb .x{position:absolute;top:16px;right:22px;color:#aaa;font-size:30px;cursor:pointer;line-height:1}
  #lb .nav{position:absolute;top:0;bottom:0;width:18%;display:flex;align-items:center;font-size:48px;color:rgba(255,255,255,.25);cursor:pointer;user-select:none}
  #lb .nav:hover{color:#fff}#lb .lp{left:0;padding-left:18px}#lb .ln{right:0;justify-content:flex-end;padding-right:18px}
  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffd479;padding:8px 18px;border-radius:22px;font-size:12.5px;z-index:200;display:none}
  /* 删除待删按钮 */
  #trashBtn{border-color:#5a3333;color:#ff8a8a;background:#2a2024}
  #trashBtn:hover{border-color:var(--danger)}
  #trashBtn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--faint);background:var(--panel2)}
  /* 断线条 */
  #offline{position:fixed;top:0;left:0;right:0;background:#7a2b2b;color:#fff;text-align:center;font-size:12px;padding:6px;z-index:300;display:none}
  /* 确认模态 */
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:none;align-items:center;justify-content:center}
  #mask.on{display:flex}
  #dlg{width:520px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #dlg h3{padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px}
  #dlg .bd{padding:14px 20px;overflow-y:auto;font-size:12.5px;line-height:1.7;color:var(--dim)}
  #dlg .bd .nm{color:var(--txt)}
  #dlg .sum{padding:10px 20px;color:var(--warn);font-size:12.5px;border-top:1px solid var(--line)}
  #dlg .ft{padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}
  .mbtn{padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .mbtn.primary{border-color:var(--warn);color:var(--warn)}
  .mbtn.danger{border-color:var(--danger);color:var(--danger)}
  .mbtn.danger.armed{background:var(--danger);color:#fff;animation:btnpulse 1.1s infinite}
  @keyframes btnpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,93,93,.5)}50%{box-shadow:0 0 0 6px rgba(255,93,93,0)}}
  .mbtn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div id="offline">⚠ 本地服务已断开，正在尝试重连…（若一直显示，请双击「启动图库预览.bat」）</div>
<div id="app">
  <div id="top">
    <h1>抽样快审</h1>
    <div id="stat"></div>
    <div class="sp"></div>
    <label style="color:var(--dim);font-size:12px">每组抽
      <select id="nSel"><option>12</option><option selected>20</option><option>30</option><option>50</option></select> 张
    </label>
    <button class="tbtn" id="trashBtn" disabled>🗑 删除待删 (0)</button>
    <a class="tbtn" href="/" target="_blank">打开主审查台 ↗</a>
  </div>
  <div id="body">
    <aside id="side">
      <div id="sideHead">未处理组列表（点击跳转）</div>
      <div id="gList"></div>
    </aside>
    <main id="main">
      <div id="gBar">
        <div id="gName">加载中…</div>
        <div id="gMeta"></div>
        <div class="sp"></div>
        <button class="tbtn" id="reshuffle" title="换一批随机图，且优先抽没看过的（R）">↻ 重新抽取 (R)</button>
      </div>
      <div id="gridWrap"><div id="grid"></div></div>
      <div id="empty" style="display:none"></div>
      <div id="decide">
        <button class="dbtn ghost" id="prevBtn">‹ 上一组 (P)</button>
        <span id="pos">– / –</span>
        <button class="dbtn ok" id="keepBtn">✓ 整组保留 (K)</button>
        <button class="dbtn del" id="delBtn">✕ 整组待删 (X)</button>
        <button class="dbtn ghost" id="nextBtn">跳过 (N) ›</button>
      </div>
    </main>
  </div>
</div>
<div id="lb"><div class="x" id="lbX">×</div><div class="nav lp" id="lbP">‹</div><div class="nav ln" id="lbN">›</div><div id="lbBox"></div><div class="cap" id="lbCap"></div></div>
<div id="toast"></div>
<div id="mask"><div id="dlg">
  <h3 id="dlgTitle">删除待删组</h3>
  <div class="bd" id="dlgBody"></div>
  <div class="sum" id="dlgSum"></div>
  <div class="ft">
    <button class="mbtn" id="dlgCancel">取消</button>
    <button class="mbtn danger" id="dlgPerm">永久删除</button>
    <button class="mbtn primary" id="dlgRecycle">移入回收站（可恢复）</button>
  </div>
</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>(''+(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSize=b=>{b=+b||0;if(b>=1073741824)return (b/1073741824).toFixed(2)+' GB';if(b>=1048576)return (b/1048576).toFixed(1)+' MB';return (b/1024).toFixed(0)+' KB';};
const turl=(f,r)=>'/thumb?folder='+encodeURIComponent(f)+'&file='+encodeURIComponent(r)+'&edge=760&q=84';
const murl=(f,r)=>'/media?folder='+encodeURIComponent(f)+'&file='+encodeURIComponent(r);
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',1800);}
/* 请求封装：统一捕获断连 */
let _off=false;
function setOffline(v){_off=v;$('offline').style.display=v?'block':'none';}
function fetchTO(u,opt,ms){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms||20000);return fetch(u,Object.assign({signal:ctl.signal},opt||{})).finally(()=>clearTimeout(tm));}
async function httpGet(u){const r=await fetchTO(u);if(!r.ok)throw new Error('http '+r.status);setOffline(false);return r;}
async function httpPost(u,o){const r=await fetchTO(u,Object.assign({method:'POST',headers:{'Content-Type':'application/json'}},o));if(!r.ok)throw new Error('http '+r.status);setOffline(false);return r;}
setInterval(async()=>{try{await fetch('/api/ping',{cache:'no-store'});setOffline(false);}catch(e){setOffline(true);}},4000);

const S={items:[],cur:-1,samples:[],seed:0,n:20,lbIdx:-1,kept:0,marked:0,seen:{},remain:{}};

async function loadList(){
  const d=await (await httpGet('/api/survey/list')).json();
  S.items=d.items.map(x=>({...x,state:'unreviewed'}));
  renderList();renderStat();
  if(S.items.length){goto(0);}else showDone();
}
function renderStat(){
  const remain=S.items.filter(x=>x.state==='unreviewed').length;
  $('stat').innerHTML=`待审 <b>${remain}</b> · 本次保留 <span class="kp">${S.kept}</span> · 本次待删 <span class="mk">${S.marked}</span> · 共 ${S.items.length} 组`;
  const tb=$('trashBtn');tb.disabled=(S.marked===0);tb.textContent=`🗑 删除待删 (${S.marked})`;
}
function renderList(){
  const box=$('gList');box.innerHTML='';
  const frag=document.createDocumentFragment();
  S.items.forEach((it,i)=>{
    const ico=it.state==='kept'?'✓':it.state==='marked'?'✕':'○';
    const d=document.createElement('div');
    d.className='g '+it.state+(i===S.cur?' active':'');
    d.innerHTML=`<span class="ico">${ico}</span><div class="m">
      <div class="nm"><span class="tag tag-${it.category}">${it.category}</span>${esc(it.name)}</div>
      <div class="sb">${fmtSize(it.size)} · ${it.media_count} 媒体</div></div>`;
    d.onclick=()=>goto(i);frag.appendChild(d);
  });
  box.appendChild(frag);
}
function showDone(){
  $('gName').textContent='全部处理完了';
  $('gMeta').textContent='';$('grid').innerHTML='';
  $('empty').style.display='flex';
  $('empty').innerHTML=`🎉 抽样列表已全部审阅<br>本次保留 ${S.kept} 组、待删 ${S.marked} 组<br><br>回到主审查台可继续细看图包，或让助手删除“待删”整批。`;
  $('pos').textContent='– / –';
}

async function goto(i){
  if(i<0||i>=S.items.length){toast('已经到头了');return;}
  S.cur=i;S.lbIdx=-1;closeLb();
  const it=S.items[i];
  $('gName').textContent=it.name;
  $('gMeta').textContent=`${fmtSize(it.size)} · ${it.media_count} 媒体 · 抽样中…`;
  $('pos').textContent=`${i+1} / ${S.items.length}`;
  $('grid').innerHTML='<div style="color:var(--faint)">抽样中…</div>';
  renderList();
  try{
    await loadSamples();
  }catch(e){
    // 断网/服务未起时不能让网格永远停在"抽样中…"（体检报告 S1）
    setOffline(true);
    $('gMeta').textContent=`${fmtSize(it.size)} · ${it.media_count} 媒体`;
    $('grid').innerHTML=`<div style="color:var(--faint);grid-column:1/-1;line-height:2.2;text-align:center">
      抽样失败：本地服务可能已断开。<br>恢复后会自动重连，也可以手动重试。
      <br><button class="tbtn" id="retrySample" style="margin-top:12px">重试</button></div>`;
    const rb=$('retrySample');if(rb)rb.onclick=()=>goto(i);
    return;
  }
  // 滚动列表到当前
  const act=$('gList').querySelector('.g.active');if(act)act.scrollIntoView({block:'nearest'});
}
async function loadSamples(announce){
  const i=S.cur;if(i<0)return;const it=S.items[i];
  if(!S.seen[it.name])S.seen[it.name]=[];
  const ex=S.seen[it.name];
  let url=`/api/survey/samples?folder=${encodeURIComponent(it.name)}&n=${S.n}&seed=${S.seed}`;
  if(ex.length)url+='&exclude='+encodeURIComponent(ex.join(','));
  const d=await (await httpGet(url)).json();
  if(S.cur!==i)return; // 已切走
  if(d.reset_round){S.seen[it.name]=[];if(announce)toast('该组已看满一轮，重新开始随机');}
  S.samples=d.samples||[];S.remain[it.name]=d.remaining;
  $('gMeta').textContent=`${fmtSize(it.size)} · 共 ${d.total_images} 图 / ${d.total_media} 媒体 · 本批 ${S.samples.length} 张 · 还剩约 ${d.remaining} 张没看`;
  renderGrid();
  prefetchNext();
}
// 后台预热“下一个未审组”的高清缩略图，切过去时秒显
async function prefetchNext(){
  const ni=S.items.findIndex((x,i)=>i>S.cur&&x.state==='unreviewed');
  if(ni<0)return;
  const it=S.items[ni];
  try{
    const ex=S.seen[it.name]||[];
    let url=`/api/survey/samples?folder=${encodeURIComponent(it.name)}&n=${S.n}&seed=${S.seed}`;
    if(ex.length)url+='&exclude='+encodeURIComponent(ex.join(','));
    const d=await (await fetchTO(url,null,20000)).json();
    if(!d.samples||!d.samples.length)return;
    await fetchTO('/api/warm',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({folder:it.name,rels:d.samples.map(s=>s.rel),edge:760})},10000);
  }catch(e){/* 预热线程失败不影响主流程 */}
}
// 重新抽取：把本批并入“已看”，换随机种子，从没看过的图里再抽一批
function reshuffle(){
  if(S.cur<0)return;const it=S.items[S.cur];
  if(!S.seen[it.name])S.seen[it.name]=[];
  for(const s of S.samples)if(!S.seen[it.name].includes(s.rel))S.seen[it.name].push(s.rel);
  S.seed=(S.seed+7919)%1000000;
  loadSamples(true).catch(()=>{setOffline(true);toast('重新抽取失败，服务可能已断开');});
}
function renderGrid(){
  const g=$('grid');g.innerHTML='';const it=S.items[S.cur];
  const frag=document.createDocumentFragment();
  S.samples.forEach((s,k)=>{
    const c=document.createElement('div');c.className='cell';
    if(s.kind==='image'){
      const im=new Image();im.decoding='async';im.alt='';
      im.onload=()=>{c.classList.add('loaded');im.classList.add('in');};
      im.onerror=()=>c.classList.add('loaded');
      im.src=turl(it.name,s.rel);c.appendChild(im);
    }else{c.innerHTML='<div class="vid">▶</div>';c.classList.add('loaded');}
    c.insertAdjacentHTML('beforeend',`<span class="idx">${k+1}</span><span class="alb">${esc(s.album||'根目录')}</span>`);
    c.onclick=()=>openLb(k);frag.appendChild(c);
  });
  g.appendChild(frag);
}

async function decide(state){
  if(S.cur<0)return;
  const it=S.items[S.cur];
  try{
    await httpPost('/api/review/state',{body:JSON.stringify({name:it.name,state})});
  }catch(e){
    setOffline(true);toast('标记失败，服务可能已断开');
    return;                    // 失败就什么都不动，避免顶部统计漂移
  }
  // 计数纠正放在请求成功之后：旧写法是"先减后加"，中途抛错就只减不加，统计会对不上（体检报告 S2）
  if(it.state==='marked')S.marked=Math.max(0,S.marked-1);
  else if(it.state==='kept')S.kept=Math.max(0,S.kept-1);
  it.state=state;if(state==='kept')S.kept++;else S.marked++;
  renderStat();renderList();
  // 自动跳到下一个未审组
  const nx=S.items.findIndex((x,i)=>i>S.cur&&x.state==='unreviewed');
  if(nx>=0)goto(nx);
  else{const any=S.items.findIndex(x=>x.state==='unreviewed');if(any>=0)goto(any);else{showDone();renderList();}}
}

/* lightbox */
function openLb(k){S.lbIdx=k;renderLb();$('lb').classList.add('on');}
function closeLb(){S.lbIdx=-1;$('lb').classList.remove('on');$('lbBox').innerHTML='';}
function renderLb(){
  if(S.lbIdx<0)return;
  const it=S.items[S.cur],s=S.samples[S.lbIdx];if(!s)return;
  $('lbBox').innerHTML=`<img src="${murl(it.name,s.rel)}" alt="">`;
  $('lbCap').textContent=`${S.lbIdx+1}/${S.samples.length} · ${s.rel}`;
}
function lbStep(d){const n=S.samples.length;if(!n)return;let k=S.lbIdx+d;if(k<0)k=0;if(k>n-1)k=n-1;if(k===S.lbIdx){toast(d<0?'第一张':'最后一张');return;}S.lbIdx=k;renderLb();}

/* 删除待删闭环 */
let _permArmed=false;
const markedList=()=>S.items.filter(x=>x.state==='marked');
function openPurge(){
  const list=markedList();if(!list.length)return;
  _permArmed=false;
  const total=list.reduce((a,b)=>a+(b.size||0),0);
  $('dlgTitle').textContent=`删除 ${list.length} 个待删组`;
  $('dlgBody').innerHTML=list.slice(0,80).map(x=>`<div class="nm">✕ ${esc(x.name)}</div>`).join('')+(list.length>80?`<div>…其余 ${list.length-80} 个</div>`:'');
  $('dlgSum').textContent=`合计约 ${fmtSize(total)} · 回收站删除可在系统回收站还原`;
  $('dlgRecycle').textContent='移入回收站（可恢复）';
  $('dlgPerm').textContent='永久删除';$('dlgPerm').classList.remove('armed');
  $('mask').classList.add('on');
}
function closePurge(){$('mask').classList.remove('on');_permArmed=false;}
async function doPurge(permanent){
  if(permanent){
    if(!_permArmed){_permArmed=true;$('dlgPerm').textContent='⚠ 再点一次确认永久删除';$('dlgPerm').classList.add('armed');return;}
  }
  const names=markedList().map(x=>x.name);if(!names.length)return;
  const payload=Object.assign({names},permanent?{confirm_permanent:true}:{});
  const btn=permanent?$('dlgPerm'):$('dlgRecycle');btn.disabled=true;const old=btn.textContent;btn.textContent='删除中…';
  try{
    const r=await (await httpPost(permanent?'/api/delete':'/api/trash',{body:JSON.stringify(payload)})).json();
    const ok=new Set(r.results.filter(x=>x.ok).map(x=>x.name));
    const fail=r.results.filter(x=>!x.ok);
    S.items=S.items.filter(x=>!ok.has(x.name));
    S.marked=markedList().length;
    closePurge();renderStat();renderList();
    const nx=S.items.findIndex(x=>x.state==='unreviewed');
    if(nx>=0)goto(nx);else showDone();
    toast(`已${permanent?'永久删除':'移入回收站'} ${ok.size} 组 · 释放 ${fmtSize(r.freed)}`+(fail.length?` · ${fail.length} 个失败`:''));
  }catch(e){toast('删除失败，服务可能已断开');setOffline(true);}
  finally{btn.disabled=false;btn.textContent=old;}
}

/* 事件 */
$('keepBtn').onclick=()=>decide('kept');
$('delBtn').onclick=()=>decide('marked');
$('nextBtn').onclick=()=>{const nx=S.items.findIndex((x,i)=>i>S.cur&&x.state==='unreviewed');goto(nx>=0?nx:S.cur+1);};
$('prevBtn').onclick=()=>goto(S.cur-1);
$('reshuffle').onclick=reshuffle;
$('trashBtn').onclick=openPurge;
$('dlgCancel').onclick=closePurge;
$('dlgRecycle').onclick=()=>doPurge(false);
$('dlgPerm').onclick=()=>doPurge(true);
$('mask').addEventListener('click',e=>{if(e.target===$('mask'))closePurge();});
$('nSel').onchange=e=>{
  S.n=+e.target.value;
  if(S.cur<0||!S.items[S.cur])return;      // 全部审完时 S.items 可能为空、S.cur=-1，直接改会抛异常
  S.seen[S.items[S.cur].name]=[];
  loadSamples().catch(()=>{setOffline(true);toast('重新抽样失败，服务可能已断开');});
};
$('lbX').onclick=closeLb;$('lbP').onclick=()=>lbStep(-1);$('lbN').onclick=()=>lbStep(1);
$('lb').addEventListener('click',e=>{if(e.target===$('lb'))closeLb();});
document.addEventListener('keydown',e=>{
  if($('mask').classList.contains('on')){if(e.key==='Escape')closePurge();return;}
  if(S.lbIdx>=0){
    if(e.key==='Escape')closeLb();
    else if(e.key==='ArrowLeft')lbStep(-1);
    else if(e.key==='ArrowRight')lbStep(1);
    return;
  }
  const k=e.key.toLowerCase();
  if(k==='k')decide('kept');
  else if(k==='x')decide('marked');
  else if(k==='r')reshuffle();
  else if(k==='n'||e.key==='ArrowDown'){e.preventDefault();$('nextBtn').click();}
  else if(k==='p'||e.key==='ArrowUp'){e.preventDefault();$('prevBtn').click();}
});
document.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')e.target.blur();},true);
loadList().catch(()=>{setOffline(true);});
</script>
</body>
